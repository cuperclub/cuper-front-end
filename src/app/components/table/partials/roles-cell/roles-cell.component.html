<div class="user-content" *ngIf="data.permisions">
  <mat-chip-listbox>
    <mat-chip-option class="name" *ngIf="data.permisions.is_cashier">
      Cajero
    </mat-chip-option>
    <mat-chip-option class="name" *ngIf="data.permisions.is_partner">
      Socio
    </mat-chip-option>
    <mat-chip-option class="name" *ngIf="data.permisions.is_admin">
      Administrador
    </mat-chip-option>
  </mat-chip-listbox>
</div>
